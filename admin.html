<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Fogão e Afeto</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: var(--bg-light);
      min-height: 100vh;
    }

    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 1px solid #f0f0f0;
    }

    .login-box .admin-badge {
      background-color: #fde8e8;
      color: var(--primary-color);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 15px;
    }

    .login-box h2 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .admin-header-nav {
      background-color: var(--white);
      box-shadow: var(--shadow);
      padding: 15px 0;
      margin-bottom: 30px;
    }

    .admin-nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-layout {
      max-width: 1200px;
      margin: 0 auto 50px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .form-card,
    .list-card {
      background: var(--white);
      padding: 25px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #f0f0f0;
    }

    .form-card h3,
    .list-card h3 {
      color: var(--primary-color);
      font-size: 1.4rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .file-upload-box {
      border: 2px dashed var(--primary-color);
      background-color: #fdf5f5;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .file-upload-box input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-box i {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    #preview-container {
      margin-top: 10px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #preview-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    .btn-admin {
      background-color: var(--primary-color);
      color: var(--white);
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-admin:hover {
      background-color: var(--primary-hover);
    }

    /* ESTILIZAÇÃO DA LISTA DE REMOÇÃO DE PRATOS */
    .admin-items-list {
      max-height: 500px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }

    .admin-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fdfbf7;
      border: 1px solid #eee;
      border-radius: 10px;
    }

    .admin-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-item-img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 8px;
    }

    .admin-item-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-dark);
    }

    .admin-item-meta {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: background-color 0.2s;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .btn-logout {
      background-color: #f1f1f1;
      color: var(--text-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .error-msg {
      color: var(--primary-color);
      font-weight: 700;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    .success-msg {
      color: #22c55e;
      font-weight: 700;
      margin-top: 15px;
      font-size: 0.95rem;
      text-align: center;
    }

    #admin-panel {
      display: none;
    }

    @media (max-width: 850px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-box">
      <span class="admin-badge"><i class="fa-solid fa-lock"></i> Área Restrita</span>
      <h2>Fogão & Afeto</h2>
      <p style="color: var(--text-light); margin-bottom: 25px; font-size: 0.95rem;">Digite suas credenciais de proprietário para acessar o painel.</p>

      <div class="form-group">
        <input type="text" id="login-user" placeholder="Usuário">
      </div>
      <div class="form-group">
        <input type="password" id="login-pass" placeholder="Senha">
      </div>
      <button class="btn-admin" onclick="fazerLogin()">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
      </button>
      <div id="login-error" class="error-msg"></div>
    </div>
  </div>

  <!-- PAINEL ADMINISTRATIVO -->
  <div id="admin-panel">

    <header class="admin-header-nav">
      <div class="container admin-nav-container">
        <div class="logo">
          <i class="fa-solid fa-utensils"></i>
          <span>Fogão & Afeto <small style="font-size: 0.75rem; color: var(--text-light);">(Painel Admin)</small></span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="index.html" class="btn-logout" style="text-decoration: none;" target="_blank"><i class="fa-solid fa-eye"></i> Ver Site</a>
          <button class="btn-logout" onclick="fazerLogout()"><i class="fa-solid fa-power-off"></i> Sair</button>
        </div>
      </div>
    </header>

    <div class="admin-layout">

      <!-- ESQUERDA: ADICIONAR NOVO PRATO -->
      <div class="form-card">
        <h3><i class="fa-solid fa-plus-circle"></i> Adicionar Prato / Item</h3>

        <div class="form-group">
          <label>Nome do Prato</label>
          <input type="text" id="item-name" placeholder="Ex: Filé à Parmegiana">
        </div>

        <div class="form-group">
          <label>Categoria</label>
          <select id="item-category">
            <option value="pfs">Pratos Feitos (PFs)</option>
            <option value="aperitivos">Petiscos</option>
            <option value="bebidas">Bebidas</option>
            <option value="sobremesas">Sobremesas</option>
          </select>
        </div>

        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.10" id="item-price" placeholder="Ex: 28.90">
        </div>

        <div class="form-group">
          <label>Descrição Curta</label>
          <textarea id="item-desc" rows="2" placeholder="Acompanhamentos e ingredientes..."></textarea>
        </div>

        <div class="form-group">
          <label>Foto do Prato</label>
          <div class="file-upload-box">
            <input type="file" id="item-file" accept="image/*" onchange="previewImagem(event)">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p style="font-size: 0.85rem; font-weight:700;">Escolher foto do PC ou Celular</p>
          </div>
          <div id="preview-container">
            <img id="preview-img" src="" alt="Prévia">
            <span id="preview-name" style="font-size: 0.85rem; font-weight: 700;"></span>
          </div>
        </div>

        <button class="btn-admin" onclick="adicionarPrato()">
          <i class="fa-solid fa-plus"></i> Cadastrar Prato
        </button>

        <div id="admin-msg" class="success-msg"></div>
      </div>

      <!-- DIREITA: GERENCIAR E REMOVER PRATOS EXISTENTES -->
      <div class="list-card">
        <h3><i class="fa-solid fa-trash-can"></i> Pratos Cadastrados no Site</h3>
        <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 15px;">Clique no botão vermelho para retirar qualquer item do cardápio em tempo real.</p>

        <div class="admin-items-list" id="admin-items-list">
          <!-- Renderizado via JavaScript -->
        </div>
      </div>

    </div>
  </div>

  <script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "fogao123";
    let imagemBase64 = "";

    function fazerLogin() {
      const u = document.getElementById("login-user").value;
      const p = document.getElementById("login-pass").value;
      const err = document.getElementById("login-error");

      if (u === ADMIN_USER && p === ADMIN_PASS) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        renderizarListaAdmin();
      } else {
        err.textContent = "Usuário ou senha incorretos!";
      }
    }

    function fazerLogout() {
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }

    function previewImagem(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        imagemBase64 = e.target.result;
        document.getElementById("preview-img").src = imagemBase64;
        document.getElementById("preview-name").textContent = file.name;
        document.getElementById("preview-container").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function adicionarPrato() {
      const name = document.getElementById("item-name").value;
      const category = document.getElementById("item-category").value;
      const price = parseFloat(document.getElementById("item-price").value);
      const description = document.getElementById("item-desc").value;
      const msg = document.getElementById("admin-msg");

      if (!name || isNaN(price) || !description) {
        alert("Por favor, preencha o nome, o preço e a descrição do prato!");
        return;
      }

      const finalImage = imagemBase64 || "https://placehold.co/400x300/e2e8f0/1e293b?text=Foto+do+Prato";

      // Pega os itens salvos ou força a carga dos itens originais se ainda não existirem
      let menuItems = JSON.parse(localStorage.getItem("fogaoAfeto_menu"));
      if (!menuItems || menuItems.length === 0) {
        menuItems = typeof defaultMenuItems !== 'undefined' ? defaultMenuItems : [];
      }

      const novoPrato = {
        id: Date.now(),
        name,
        category,
        price,
        description,
        image: finalImage
      };

      menuItems.push(novoPrato);
      localStorage.setItem("fogaoAfeto_menu", JSON.stringify(menuItems));

      msg.textContent = "✨ Prato adicionado com sucesso ao cardápio!";

      // Limpar formulário
      document.getElementById("item-name").value = "";
      document.getElementById("item-price").value = "";
      document.getElementById("item-desc").value = "";
      document.getElementById("item-file").value = "";
      document.getElementById("preview-container").style.display = "none";
      imagemBase64 = "";

      renderizarListaAdmin();
      setTimeout(() => { msg.textContent = ""; }, 3000);
    }

    function removerPrato(id) {
      if (!confirm("Tem certeza que deseja retirar este prato do site?")) return;

      let menuItems = JSON.parse(localStorage.getItem("fogaoAfeto_menu")) || [];
      menuItems = menuItems.filter(item => item.id !== id);

      localStorage.setItem("fogaoAfeto_menu", JSON.stringify(menuItems));
      renderizarListaAdmin();
    }

    function renderizarListaAdmin() {
      const listContainer = document.getElementById("admin-items-list");
      let menuItems = JSON.parse(localStorage.getItem("fogaoAfeto_menu"));

      if (!menuItems || menuItems.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center; color:#888;'>Nenhum prato cadastrado.</p>";
        return;
      }

      listContainer.innerHTML = "";
      menuItems.forEach(item => {
        const row = document.createElement("div");
        row.classList.add("admin-item-row");

        row.innerHTML = `
          <div class="admin-item-info">
            <img src="${item.image}" class="admin-item-img" onerror="this.src='https://placehold.co/100/e2e8f0/1e293b?text=Foto';">
            <div>
              <div class="admin-item-title">${item.name}</div>
              <div class="admin-item-meta">${item.category.toUpperCase()} - R$ ${Number(item.price).toFixed(2).replace(".", ",")}</div>
            </div>
          </div>
          <button class="btn-delete" onclick="removerPrato(${item.id})"><i class="fa-solid fa-trash"></i> Remover</button>
        `;

        listContainer.appendChild(row);
      });
    }
  </script>
</body>

</html>
